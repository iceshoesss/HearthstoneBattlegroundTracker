name: Cards Web Build & Deploy

# 统一发布入口：repository_dispatch（BattlegroundDB 更新）与 push（代码/筛选改动）
# 都先拉最新 bg_cards.json 再构建，避免 push 用仓库里过期的 public/data/cards.json 把站点版本冲回去。
#
# 数据来源：BattlegroundDB master 的 BattlegroundDB/Data/bg_cards.json（全量）。
# raw_bg_cards.json 为 CI 临时文件（已 gitignore），不回写仓库。

on:
  repository_dispatch:
    types: [bgdb-updated]
  push:
    branches: [feature/card-browser]
    paths-ignore:
      # 仅文档/无关文件变更时不触发；空 commit 也会被 paths 过滤跳过
      - '**/*.md'
      - '.omo/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # dispatch：固定网页分支；push：用触发提交
          ref: ${{ github.event_name == 'repository_dispatch' && 'feature/card-browser' || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest BattlegroundDB data
        run: cd HBTCards-Web && node scripts/fetch-raw.mjs

      - name: Install deps
        run: cd HBTCards-Web && npm ci

      - name: Build (raw → cards.json + images + vite)
        run: cd HBTCards-Web && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: HBTCards-Web
          command: pages deploy dist --project-name=hbt-cards --commit-dirty=true
