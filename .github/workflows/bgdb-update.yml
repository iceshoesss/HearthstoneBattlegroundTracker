name: Bgdb Update 鈫?Rebuild Cards Web

on:
  repository_dispatch:
    types: [bgdb-updated]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/card-browser

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: cd HBTCards-Web && npm ci

      - name: Build (fetch data + images + vite)
        run: cd HBTCards-Web && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: HBTCards-Web
          command: pages deploy dist --project-name=hbt-cards
